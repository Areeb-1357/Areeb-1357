        <text x="34" y="122" clip-path="url(#c1)"><tspan class="purple">&gt; </tspan><tspan class="fg">whoami</tspan></text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.0234;1" values="0;1;1"/>
        <text x="34" y="150"><tspan class="blue">areeb basheer</tspan><tspan class="muted"> — aiml student · python tooling · web dev · India · Hyderabad</tspan></text>
      </g>

      <!-- neofetch -->
      <g opacity="0">
        <animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.0386;1" values="0;1;1"/>
        <text x="34" y="192" clip-path="url(#c2)"><tspan class="purple">&gt; </tspan><tspan class="fg">neofetch</tspan></text>
      </g>

