<svg viewBox="0 0 940 1010" xmlns="http://www.w3.org/2000/svg" font-family="'Fira Code','JetBrains Mono','Cascadia Code','Consolas','DejaVu Sans Mono',monospace">
  <defs>
    <style>
      .muted { fill: #565f89; }
      .fg    { fill: #c0caf5; }
      .blue  { fill: #7aa2f7; }
      .cyan  { fill: #7dcfff; }
      .green { fill: #9ece6a; }
      .purple{ fill: #bb9af7; }
      .yellow{ fill: #e0af68; }
      .pre   { white-space: pre; }
    </style>

    <linearGradient id="winbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1c29"/>
      <stop offset="1" stop-color="#15161f"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dcfff" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#bb9af7" stop-opacity=".35"/>
      <stop offset="1" stop-color="#7aa2f7" stop-opacity=".5"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dcfff"/>
      <stop offset="1" stop-color="#bb9af7"/>
