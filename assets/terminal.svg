        <animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2134;1" values="0;1;1"/>
        <text x="34" y="742" class="purple">*</text>
        <text x="54" y="742"><tspan class="yellow">4d61a0f</tspan><tspan class="muted"> feat: decision agent - comparison scoring</tspan></text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2186;1" values="0;1;1"/>
        <text x="34" y="768" class="purple">*</text>
        <text x="54" y="768"><tspan class="yellow">9c0e2f1</tspan><tspan class="muted"> style: portfolio project card refresh</tspan></text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2237;1" values="0;1;1"/>
        <text x="34" y="794" class="purple">*</text>
        <text x="54" y="794"><tspan class="yellow">e5a1d77</tspan><tspan class="muted"> chore: more DSA reps on LeetCode</tspan></text>
