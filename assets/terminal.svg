        <animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2417;1" values="0;1;1"/>
        <text x="34" y="828" clip-path="url(#c5)"><tspan class="purple">&gt; </tspan><tspan class="fg">sudo ./exploit --target comfort_zone</tspan></text>
