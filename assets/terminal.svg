      <g fill="url(#brand)" class="pre" xml:space="preserve">
        <text x="34" y="232" opacity="0" xml:space="preserve" class="pre">    ___    ____ <animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.054;1" values="0;1;1"/></text>
        <text x="34" y="254" opacity="0" xml:space="preserve" class="pre">   /   |  / __ )<animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.0576;1" values="0;1;1"/></text>
        <text x="34" y="276" opacity="0" xml:space="preserve" class="pre">  / /| | / __  |<animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.0612;1" values="0;1;1"/></text>
        <text x="34" y="298" opacity="0" xml:space="preserve" class="pre"> / ___ |/ /_/ / <animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.0648;1" values="0;1;1"/></text>
        <text x="34" y="320" opacity="0" xml:space="preserve" class="pre">/_/  |_/_____/  <animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.0684;1" values="0;1;1"/></text>
      </g>

