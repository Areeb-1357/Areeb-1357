    <!-- session header -->
    <text x="34" y="76" class="green"><tspan>●</tspan></text>
    <text x="52" y="76" class="blue"><tspan style="font-size:17px">[0] areeb@arch:~</tspan></text>
    <text x="906" y="76" text-anchor="end" class="muted"><tspan style="font-size:15px">tokyonight · 2026-11-02</tspan></text>

