        <rect x="378" y="392" width="22" height="12" rx="2" fill="#9ece6a"/>
        <rect x="404" y="392" width="22" height="12" rx="2" fill="#73daca"/>
        <rect x="430" y="392" width="22" height="12" rx="2" fill="#7dcfff"/>
        <rect x="456" y="392" width="22" height="12" rx="2" fill="#7aa2f7"/>
        <rect x="482" y="392" width="22" height="12" rx="2" fill="#bb9af7"/>
      </g>

