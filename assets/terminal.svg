      <stop offset="1" stop-color="#7dcfff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#7aa2f7" fill-opacity=".1"/>
    </pattern>

    <clipPath id="win"><rect width="940" height="1010" rx="14"/></clipPath>

    <!-- typing wipes -->
    <clipPath id="c1"><rect x="30" y="102" height="28" width="0">
      <animate attributeName="width" dur="14s" repeatCount="indefinite" keyTimes="0;0.007;0.0154;1" values="0;0;420;420"/>
    </rect></clipPath>
    <clipPath id="c2"><rect x="30" y="172" height="28" width="0">
      <animate attributeName="width" dur="14s" repeatCount="indefinite" keyTimes="0;0.0386;0.0473;1" values="0;0;420;420"/>
    </rect></clipPath>
    <clipPath id="c3"><rect x="30" y="426" height="28" width="0">
