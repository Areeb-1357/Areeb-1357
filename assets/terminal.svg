        <animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2777;1" values="0;1;1"/>
        <text x="34" y="856" class="muted"><tspan>[sudo] password for areeb: </tspan><tspan class="fg">········</tspan></text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.288;1" values="0;1;1"/>
        <text x="34" y="884" class="green"><tspan>[+] payload delivered [</tspan></text>
        <rect x="248" y="872" width="220" height="16" rx="2" fill="#292e42"/>
