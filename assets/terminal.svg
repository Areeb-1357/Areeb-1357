        <animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.0566;1" values="0;1;1"/>
        <text x="300" y="226" fill="url(#brand)" font-weight="700">areeb@arch</text>
        <path d="M300 236H470" stroke="#565f89" stroke-opacity=".6"/>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.0617;1" values="0;1;1"/>
        <text y="266"><tspan class="blue" x="300">role</tspan><tspan class="fg" x="380">aiml student</tspan></text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.0669;1" values="0;1;1"/>
        <text y="288"><tspan class="blue" x="300">stack</tspan><tspan class="fg" x="380">python · html · css · javascript</tspan></text>
