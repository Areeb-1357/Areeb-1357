<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="55%" stop-color="#050b1f"/>
      <stop offset="100%" stop-color="#0a1230"/>
    </linearGradient>

    <radialGradient id="vignette" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="75%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>

    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="45%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <pattern id="dotGrid" width="46" height="46" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#3b82f6" opacity="0.35"/>
    </pattern>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- base -->
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#dotGrid)" opacity="0.4"/>
  <circle cx="600" cy="150" r="260" fill="url(#coreGlow)">
    <animate attributeName="r" values="240;280;240" dur="6s" repeatCount="indefinite"/>
  </circle>
  <rect width="1200" height="300" fill="url(#vignette)"/>

  <!-- thin diagonal data threads -->
  <g fill="none" stroke="#38bdf8" stroke-width="1">
    <path d="M-50 40 L400 220" opacity="0.18" stroke-dasharray="2 6">
      <animate attributeName="stroke-dashoffset" from="0" to="-160" dur="9s" repeatCount="indefinite"/>
    </path>
    <path d="M1250 60 L820 260" opacity="0.16" stroke-dasharray="2 6">
      <animate attributeName="stroke-dashoffset" from="0" to="-160" dur="11s" repeatCount="indefinite"/>
    </path>
    <path d="M-50 260 L350 40" opacity="0.12" stroke-dasharray="1 7">
      <animate attributeName="stroke-dashoffset" from="0" to="-140" dur="13s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- minimal node-link accents, corners only -->
  <g stroke="#38bdf8" stroke-width="1" opacity="0.35" fill="none">
    <path d="M60 60 L140 60 L140 105"/>
    <path d="M1140 240 L1060 240 L1060 195"/>
  </g>
  <g fill="#7dd3fc">
    <circle cx="60" cy="60" r="2.5">
      <animate attributeName="opacity" values="0.9;0.25;0.9" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="140" cy="105" r="2.5">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.4s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1140" cy="240" r="2.5">
      <animate attributeName="opacity" values="0.9;0.25;0.9" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1060" cy="195" r="2.5">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.8s" begin="0.7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- fine corner brackets -->
  <g stroke="#38bdf8" stroke-width="1.2" opacity="0.4" fill="none">
    <path d="M30 24 H70 M30 24 V64"/>
    <path d="M1170 276 H1130 M1170 276 V236"/>
  </g>

  <!-- name, slow ambient float -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-4; 0,0" dur="6s" repeatCount="indefinite"/>
    <text x="600" y="158" text-anchor="middle" font-family="'Segoe UI', 'Fira Code', monospace" font-size="82" font-weight="600"
          fill="url(#nameGrad)" filter="url(#glow)" letter-spacing="14">AREEB</text>
  </g>

  <!-- subtitle -->
  <text x="600" y="200" text-anchor="middle" font-family="'Fira Code', monospace" font-size="15" fill="#93c5fd" letter-spacing="6" opacity="0.85">
    ARTIFICIAL INTELLIGENCE &#160;&#8212;&#160; CYBERSECURITY
    <animate attributeName="opacity" values="0.55;0.95;0.55" dur="4.5s" repeatCount="indefinite"/>
  </text>

  <!-- thin scan line with traveling glow dot -->
  <line x1="440" y1="222" x2="760" y2="222" stroke="#1e3a5f" stroke-width="1"/>
  <circle cy="222" r="3" fill="#7dd3fc" filter="url(#softGlow)">
    <animate attributeName="cx" values="440;760;440" dur="5s" repeatCount="indefinite"/>
  </circle>
</svg>
