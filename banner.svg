<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0a0e14"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF9C"/>
      <stop offset="50%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#8A2BE2"/>
    </linearGradient>

    <pattern id="circuit" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M0 60 H40 V20 H90" stroke="#00FF9C" stroke-width="1" fill="none" opacity="0.25"/>
      <path d="M120 30 H80 V90 H50" stroke="#00E5FF" stroke-width="1" fill="none" opacity="0.2"/>
      <path d="M60 0 V40 H100 V120" stroke="#8A2BE2" stroke-width="1" fill="none" opacity="0.2"/>
      <circle cx="40" cy="20" r="2.5" fill="#00FF9C" opacity="0.5"/>
      <circle cx="90" cy="20" r="2.5" fill="#00E5FF" opacity="0.5"/>
      <circle cx="80" cy="90" r="2.5" fill="#8A2BE2" opacity="0.5"/>
      <circle cx="100" cy="120" r="2.5" fill="#00FF9C" opacity="0.4"/>
    </pattern>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="fade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#circuit)"/>
  <rect width="1200" height="300" fill="url(#fade)"/>

  <g fill="#00FF9C" opacity="0.22" font-family="Fira Code, monospace" font-size="13">
    <text x="20" y="30">01001000 01100101 01101100 01101100 01101111</text>
    <text x="640" y="45">10110010 01011010 00110101 10101100</text>
    <text x="60" y="270">11000110 10011010 01101001 00101101</text>
    <text x="700" y="280">01010011 01100101 01100011 01110101 01110010</text>
    <text x="900" y="55">01000001 01001001</text>
    <text x="30" y="250">ACCESS::0x7F3A2E</text>
    <text x="960" y="260">SCAN_COMPLETE::OK</text>
  </g>

  <g font-family="Fira Code, monospace" fill="none" stroke="#00E5FF" opacity="0.35">
    <path d="M40 40 H120 V60" stroke-width="1.5"/>
    <path d="M1160 260 H1080 V240" stroke-width="1.5"/>
    <rect x="30" y="30" width="14" height="14" stroke-width="1.5"/>
    <rect x="1156" y="256" width="14" height="14" stroke-width="1.5"/>
  </g>

  <text x="600" y="150" text-anchor="middle" font-family="Fira Code, monospace" font-size="88" font-weight="700" fill="url(#nameGrad)" filter="url(#glow)" letter-spacing="10">AREEB</text>

  <text x="600" y="195" text-anchor="middle" font-family="Fira Code, monospace" font-size="20" fill="#8A2BE2" letter-spacing="4" opacity="0.9">&gt; ARTIFICIAL INTELLIGENCE // CYBERSECURITY</text>

  <g font-family="Fira Code, monospace" font-size="13" fill="#00FF9C" opacity="0.85">
    <rect x="480" y="220" width="240" height="26" rx="4" fill="#0d1117" stroke="#00FF9C" stroke-width="1" opacity="0.7"/>
    <text x="600" y="238" text-anchor="middle" letter-spacing="2">SYSTEM STATUS: ONLINE ●</text>
  </g>
</svg>
